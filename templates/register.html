{% extends "base.html" %}

{% block title %}Register | CarPredict{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card register-card">

        <div class="auth-card-header">

            <div class="auth-logo">
                🚗
            </div>

            <h2>
                Create Account
            </h2>

            <p>
                Create your CarPredict account
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('register') }}"
            class="auth-form"
        >

            <div class="form-group">

                <label for="name">
                    👤 Full Name
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="username">
                    @ Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Choose a username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    🔒 Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔑
                    </span>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Minimum 6 characters"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="toggleRegisterPassword('password')"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    🔒 Confirm Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔑
                    </span>

                    <input
                        id="confirm_password"
                        name="confirm_password"
                        type="password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Create Account
                <span>→</span>
            </button>

        </form>


        <div class="register-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign in
            </a>

        </div>

    </div>

</div>

{% endblock %}
