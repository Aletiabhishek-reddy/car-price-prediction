<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Price Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white text-center">

            <h2>🚗 Car Price Prediction System</h2>

            <p>Predict the selling price of your car using Machine Learning</p>

        </div>

        <div class="card-body">

            <form action="/predict" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Manufacturing Year</label>

                        <input
                        type="number"
                        class="form-control"
                        name="year"
                        required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Present Price (Lakhs)</label>

                        <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="present_price"
                        required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Kilometers Driven</label>

                        <input
                        type="number"
                        class="form-control"
                        name="kms_driven"
                        required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Fuel Type</label>

                        <select
                        class="form-select"
                        name="fuel_type">

                            <option>Petrol</option>
                            <option>Diesel</option>
                            <option>CNG</option>

                        </select>

                                        <div class="col-md-6 mb-3">

                        <label class="form-label">Seller Type</label>

                        <select
                        class="form-select"
                        name="seller_type">

                            <option>Dealer</option>
                            <option>Individual</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Transmission</label>

                        <select
                        class="form-select"
                        name="transmission">

                            <option>Manual</option>
                            <option>Automatic</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Number of Previous Owners</label>

                        <input
                        type="number"
                        class="form-control"
                        name="owner"
                        min="0"
                        max="5"
                        required>

                    </div>

                </div>

                <div class="text-center mt-4">

                    <button
                    class="btn btn-success btn-lg"
                    type="submit">

                        Predict Price

                    </button>

                </div>

            </form>

            {% if prediction %}

            <div class="alert alert-success mt-4 text-center">

                <h3>Predicted Selling Price</h3>

                <h2>{{ prediction }}</h2>

            </div>

            {% endif %}

            <div class="text-center mt-4">

                <a href="/history" class="btn btn-outline-primary">
                    View Prediction History
                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
